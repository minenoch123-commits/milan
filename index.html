 const L=S.p.filter(p=>p[topK]>0).sort((a,b)=>b[topK]-a[topK]).slice(0,10),ls=E('div','lst');

function render(){const A=$('#app');A.textContent='';
 const sub={home:S.sub,line:'Formación '+S.f+' · '+S.n+' en cancha',squad:'Plantel · '+S.p.length+' jugadores',top:'Los mejores del plantel'}[view];

 const tb=E('nav','tab');[['home','Inicio','home'],['line','Alineación','field'],['squad','Plantel','squad'],['top','Top','trophy']].forEach(([v,l,i])=>{const b=E('button',v===view?'on':'');b.innerHTML=ic(i,22)+'<span>'+l+'</span>';b.onclick=()=>{view=v;render()};tb.append(b)});
 A.append(hdr(sub),mn,tb);document.documentElement.style.setProperty('--carta',`url("${S.carta||'/carta.png'}")`);fit()}
function fit(){const m=$('#mn');if(!m)return;
 if(view==='line'){const f=$('.fd');if(!f)return;const W=f.clientWidth,H=f.clientHeight,rows=S.f.split('-').map(Number),k=rows.length,mx=Math.max(...rows);
  f.style.setProperty('--cw',Math.max(34,Math.min(W/(mx+.5),H*.66/k*1.05/1.49,H*.2))+'px')}
 if(view==='squad'){const g=$('.grid'),n=S.p.length+(dt?1:0),W=g.clientWidth,H=g.clientHeight;let bw=0,bc=3;
  for(let c=1;c<=n;c++){const r=Math.ceil(n/c),w=Math.min((W-6*(c-1))/c,(H-6*(r-1))/r/1.49);if(w>bw){bw=w;bc=c}}
  bw=Math.max(58,Math.floor(bw));g.style.setProperty('--c',bc);g.style.setProperty('--cw',bw+'px');g.style.minHeight=Math.ceil(n/bc)*(bw*1.49+6)+'px'}}
new ResizeObserver(fit).observe(document.body);addEventListener('orientationchange',()=>setTimeout(fit,200));
function sheet(title,fn){const M=$('#m');M.textContent='';const ov=E('div','ov'),sh=E('div','sh'),x=E('button','x');x.innerHTML=ic('x');x.onclick=closeS;sh.append(x);if(title)sh.append(E('h3',0,title));fn(sh);ov.append(sh);M.append(ov)}

function peek(p){const M=$('#m');M.textContent='';const ov=E('div','pk'),w=E('div','mc'),ch=E('div','chips');w.append(card(p));
 [[p.st?'Titular':'Suplente',1],[p.pos],num(p)?['Dorsal '+num(p)]:null].filter(Boolean).forEach(([t,on])=>ch.append(E('span','chip'+(on?' on':''),t)));
 const x=E('button','x');x.innerHTML=ic('x');x.style.top='calc(14px + env(safe-area-inset-top,0px))';ov.append(x,w,ch);ov.onclick=()=>M.textContent='';M.append(ov)}
const hs=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mlk'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function pinSheet(){sheet('Ingresar como DT',sh=>{sh.append(E('label',0,'PIN'));const i=E('input');i.type='password';i.inputMode='numeric';i.autocomplete='off';sh.append(i);
 const b=E('button','btn g','Entrar'),bx=E('div','btns');b.style.flex=1;const go=async()=>{const r=await api({act:'login',pin:i.value});if(r&&r.ok){PIN=i.value;sessionStorage.setItem('pin',PIN);dt=true;sessionStorage.setItem('dt','1');closeS()}else{i.value='';i.placeholder=r?'PIN incorrecto':'Sin conexión al servidor'}};
 b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};bx.append(b);sh.append(bx);setTimeout(()=>i.focus(),50)})}
function fld(lab,o,k,type){const w=E('div');w.append(E('label',0,lab));const i=E('input');i.type=type||'number';if(!type){i.inputMode='numeric';i.onfocus=()=>i.select()}else i.autocomplete='off';i.value=o[k]??'';i.oninput=()=>{o[k]=type?i.value:(+i.value||0);persist();o.cb&&o.cb()};return w.append(i),w}
function seg(opts,cur,fn){const s=E('div','seg');opts.forEach(x=>{const b=E('button',x===cur?'on':'',x);b.onclick=()=>{[...s.children].forEach(c=>c.className=c===b?'on':'');fn(x)};s.append(b)});return s}
function pickImg(max,cb){const i=E('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);let al=0;try{const d=x.getImageData(0,0,c.width,c.height).data;for(let j=3;j<d.length;j+=16)if(d[j]<250){al=1;break}}catch(e){}cb(al?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85),al)};im.onerror=()=>alert('No se pudo leer la imagen.');im.src=URL.createObjectURL(f)};i.click()}
function modal(p,isNew){sheet(isNew?'Nuevo jugador':'',sh=>{const cw=E('div','mc'),fill=()=>{cw.textContent='';cw.append(card(p))};fill();sh.append(cw);
 const bx=E('div','btns'),ph=E('button','btn');ph.innerHTML=ic('cam',18)+(img(p)?' Cambiar foto':' Subir foto');const bk=()=>modal(p,isNew);ph.onclick=()=>pickImg(480,(d,al)=>cropSheet(p,d,al?'h':'c',bk));bx.append(ph);
 if(img(p)){const cr=E('button','btn','Recortar');cr.onclick=()=>cropSheet(p,img(p),0,bk);const rm=E('button','btn o','Quitar foto');rm.onclick=()=>{delete p.img;delete p.cr;persist();bk()};bx.append(cr,rm)}sh.append(bx);
 const o=new Proxy(p,{get:(t,k)=>k==='cb'?fill:t[k]});sh.append(fld('Nombre',o,'name','text'),E('label',0,'Posición'),seg(POS,p.pos,x=>{p.pos=x;persist();fill()}));
 const g=E('div','f3');[['Dorsal','num'],['GRL','ovr'],['Goles','g'],['Asist.','a'],['Salvadas','s']].forEach(([l,k])=>g.append(fld(l,o,k)));sh.append(g);
 const b2=E('div','btns');
 if(isNew){const b=E('button','btn r b','Agregar al plantel');b.onclick=()=>{if(!String(p.name).trim())p.name='Jugador '+p.id;S.p.push(p);persist();closeS()};b2.append(b)}
 else{const bn=S.p.filter(q=>!q.st),stt=S.p.filter(q=>q.st);
  if(p.st&&bn.length){const b=E('button','btn r');b.innerHTML=ic('swap',18)+' Sustituir';b.onclick=()=>listSheet('Quién entra por '+p.name,bn,q=>sw(p,q));b2.append(b)}
  if(!p.st&&stt.length){const b=E('button','btn r');b.innerHTML=ic('swap',18)+' Poner en cancha';b.onclick=()=>listSheet('Quién sale',stt,q=>sw(q,p));b2.append(b)}
  const d=E('button','btn o');d.innerHTML=ic('del',18)+' Eliminar';d.onclick=()=>{if(!confirm('¿Eliminar a '+(p.name||'este jugador')+'?'))return;const b0=S.p.find(q=>!q.st&&q!==p);if(p.st&&b0){b0.x=p.x;b0.y=p.y;b0.pos=p.pos;b0.st=1}S.p=S.p.filter(q=>q!==p);persist();closeS()};b2.append(d);
  const dn=E('button','btn g','Listo');dn.style.cssText='width:100%;margin-top:14px';dn.onclick=closeS;b2.append(dn)}
 sh.append(b2)})}
function cropSheet(p,src,mode,back){const im=new Image();im.onload=()=>{
 const R=im.height/im.width,hp=c=>c.w*R/FA,fit=m=>{const w=m==='h'?100*FA/R:Math.max(100,100*FA/R),c={w,l:(100-w)/2,t:0};c.t=m==='h'?100-hp(c):(100-hp(c))*.25;return c};
 let c=!mode&&p.cr&&isFinite(p.cr.w)?{...p.cr}:fit(mode||'c');
 sheet('Ajustar foto',sh=>{const box=E('div','mc'),cd=card({...p,img:src,cr:c}),ph=cd.querySelector('.ph'),mi=ph.querySelector('img'),rg=E('input');
  ph.style.cssText+=';-webkit-mask-image:none;mask-image:none;outline:1.5px dashed #fffa;touch-action:none';box.append(cd);rg.type='range';rg.min=20;rg.max=500;rg.style.width='100%';
  const ap=()=>{c.w=Math.max(20,Math.min(500,c.w));mi.style.cssText=cs(c);rg.value=c.w},zoom=w=>{const cx=c.l+c.w/2,cy=c.t+hp(c)/2;c.w=Math.max(20,Math.min(500,w));c.l=cx-c.w/2;c.t=cy-hp(c)/2;ap()},pts=new Map();let d0=0,w0=0;
  ph.onpointerdown=e=>{ph.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const[a,b]=[...pts.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);w0=c.w}};
  ph.onpointermove=e=>{const o=pts.get(e.pointerId);if(!o)return;const r=ph.getBoundingClientRect();if(pts.size===1){c.l+=(e.clientX-o[0])/r.width*100;c.t+=(e.clientY-o[1])/r.height*100;ap()}pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2&&d0){const[a,b]=[...pts.values()];zoom(w0*Math.hypot(a[0]-b[0],a[1]-b[1])/d0)}};
  ph.onpointerup=ph.onpointercancel=e=>{pts.delete(e.pointerId);d0=0};rg.oninput=()=>zoom(+rg.value);
  const md=E('div','seg');md.style.marginTop='10px';[['Cuerpo entero','h'],['Rellenar','c'],['Centrar',0]].forEach(([l,m])=>{const b=E('button',0,l);b.onclick=()=>{if(m)c=fit(m);else{c.l=(100-c.w)/2;c.t=(100-hp(c))/2}ap()};md.append(b)});
  const bx=E('div','btns'),ok=E('button','btn g b','Usar foto'),no=E('button','btn b','Cancelar');ok.onclick=()=>{p.img=src;p.cr={w:+c.w.toFixed(2),l:+c.l.toFixed(2),t:+c.t.toFixed(2)};persist();back()};no.onclick=back;bx.append(no,ok);
  sh.append(box,E('p','tip','Arrastra para mover; pellizca o usa el control para hacer zoom. Para PNG sin fondo usa "Cuerpo entero".'),rg,md,bx);ap()})};im.src=src}
